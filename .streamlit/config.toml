# Streamlit's own theme for Tiny Aya Translate — dual light/dark mode.
# These are Streamlit's stock default colors, stated explicitly rather than
# inherited. Note what this file does NOT earn: a repo with no config at all
# still gets the full System/Light/Dark switch, so defining both sections is
# not what surfaces it. What is true is narrower -- once a *custom* theme
# exists at all, both [theme.light] and [theme.dark] must carry values or
# Streamlit collapses the settings menu to a single locked "Custom Theme"
# entry. Keeping the file is a choice to state the palette explicitly and give
# the theme tests something to read; deleting it would look identical.
# Typography, radii and link underlines are
# deliberately absent so they fall back to Streamlit's defaults (Source Sans,
# 16px base, underlined links).
#
# Values are Streamlit 1.61's built-in palette, by its own scale names:
#   red70 #ff4b4b · gray20 #f0f2f6 · gray85 #31333f
#   gray90 #262730 · gray100 #0e1117 · gray10 #fafafa
#   blue90 #0054a3 · blue60 #3d9df3
# linkColor is Streamlit's resolved blueTextColor for each mode.
#
# codeBackgroundColor is the ONE deliberate departure from stock, and the reason
# is now SPATIAL, not temporal. It used to be temporal: the Text tab streamed
# into st.code and then swapped in a settled, disabled text_area, so the panel
# changed shade the instant a translation finished. That swap is gone -- settled
# output renders through st.code too -- so do not go looking for it.
#
# What survives is stronger. The Text tab's input text_area (painted with
# secondaryBackgroundColor) and its output st.code (painted with
# codeBackgroundColor) sit side by side in one row. Left unset,
# codeBackgroundColor falls back to Streamlit's bgMix -- a 50/50 blend of the
# two backgrounds (#1a1c24 dark, #f8f9fb light) -- which would make two adjacent
# panels of a single workspace two different shades, permanently and across a
# 16px gutter. Pinning them together is what makes the pair read as one surface.

[theme.light]
primaryColor = "#ff4b4b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#31333f"
linkColor = "#0054a3"
codeBackgroundColor = "#f0f2f6"

[theme.dark]
primaryColor = "#ff4b4b"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#262730"
textColor = "#fafafa"
linkColor = "#3d9df3"
codeBackgroundColor = "#262730"
