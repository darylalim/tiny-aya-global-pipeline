# Streamlit's own theme for Tiny Aya Translate — dual light/dark mode.
# These are Streamlit's stock default colors, stated explicitly rather than
# inherited: defining both [theme.light] and [theme.dark] is what surfaces the
# light/dark switch in Streamlit's settings menu, and a lone [theme] section
# would lock the app to one mode. Typography, radii and link underlines are
# deliberately absent so they fall back to Streamlit's defaults (Source Sans,
# 16px base, underlined links).
#
# Values are Streamlit 1.61's built-in palette, by its own scale names:
#   red70 #ff4b4b · gray20 #f0f2f6 · gray85 #31333f
#   gray90 #262730 · gray100 #0e1117 · gray10 #fafafa
#   blue90 #0054a3 · blue60 #3d9df3
# linkColor is Streamlit's resolved blueTextColor for each mode.
#
# codeBackgroundColor is the ONE deliberate departure from stock. The Text tab
# streams into st.code and then swaps in a settled, disabled text_area; st.code
# is painted with codeBackgroundColor, the text_area with secondaryBackgroundColor.
# Left unset, codeBackgroundColor falls back to Streamlit's bgMix -- a 50/50 blend
# of the two backgrounds (#1a1c24 dark, #f8f8fa light) -- so the output panel
# visibly changed shade the instant a translation finished. Pinning it to
# secondaryBackgroundColor makes that handoff seamless, which is what the
# previous Nord theme did and why the seam never showed before.

[theme.light]
primaryColor = "#ff4b4b"
backgroundColor = "#ffffff"
secondaryBackgroundColor = "#f0f2f6"
textColor = "#31333f"
linkColor = "#0054a3"
codeBackgroundColor = "#f0f2f6"

[theme.dark]
primaryColor = "#ff4b4b"
backgroundColor = "#0e1117"
secondaryBackgroundColor = "#262730"
textColor = "#fafafa"
linkColor = "#3d9df3"
codeBackgroundColor = "#262730"
