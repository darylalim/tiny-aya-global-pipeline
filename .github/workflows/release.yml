name: Release

# Dispatch-triggered rather than tag-triggered: this workflow *creates* the tag.
# A tag pushed with GITHUB_TOKEN does not trigger other workflows, so an
# `on: push: tags:` release job would silently never fire.
#
# ci.yml publishes a release for any version bump that lands on main, which makes
# this the second of two release paths. They do not collide, for the same reason
# stated above: the bump commit below is pushed with GITHUB_TOKEN, so it does not
# start a CI run at all -- and even if it did, ci.yml skips any version that is
# already tagged, which this workflow has done by then. What this path adds is
# performing the bump itself, which `uv version --bump` gets right across both
# pyproject.toml and uv.lock.
on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Semver bump"
        type: choice
        options: [patch, minor, major]
        default: minor

# The bump commit and the tag both need write access.
permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    # Same runner as ci.yml: mlx-lm installs natively on Apple Silicon.
    runs-on: macos-latest
    # Same reasoning as ci.yml's check job -- 6-hour default against 10x billing.
    # This path also pushes a commit and a tag, so a hang is worth cutting short.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # changelog needs full history and tags

      # Exact version, NOT `@v9` -- see the note in ci.yml: setup-uv publishes no
      # floating major tags after v7.6, so `v9` is not a resolvable ref.
      - name: Install uv
        uses: astral-sh/setup-uv@v9.0.0
        with:
          enable-cache: true

      # `--locked`, matching ci.yml: uv.lock records the project's own version,
      # so a bare sync would paper over a stale lock right before bumping it.
      - name: Install dependencies (core + dev tools)
        run: uv sync --locked

      # Never cut a release from a red tree — same gate as ci.yml.
      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest -q

      # `uv version --bump` rewrites pyproject.toml *and* re-locks uv.lock, which
      # records the project's own version. Bumping only pyproject leaves the lock
      # stale until the next uv command rewrites it underneath you.
      - name: Bump version
        id: bump
        # Interpolations are passed through env: rather than substituted into
        # the script text, so no input can ever be parsed as shell.
        env:
          BUMP: ${{ inputs.bump }}
        run: |
          uv version --bump "$BUMP"
          echo "version=$(uv version --short)" >> "$GITHUB_OUTPUT"

      # Commits land directly on main, so there are no merged PRs for GitHub's
      # own --generate-notes to aggregate. Parse the conventional-commit log
      # instead. Must run before the new tag exists, or the range collapses.
      # The script is shared with ci.yml's release job so the two paths cannot
      # drift into describing the same commits differently.
      - name: Build changelog from conventional commits
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: .github/scripts/release-notes.sh "$RUNNER_TEMP/notes.md"

      - name: Commit, tag, push
        env:
          VERSION: ${{ steps.bump.outputs.version }}
          # A branch name can contain shell metacharacters; never inline it.
          REF: ${{ github.ref_name }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pyproject.toml uv.lock
          git commit -m "chore: bump version to ${VERSION}"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "HEAD:${REF}" "refs/tags/v${VERSION}"

      # Published, not drafted, matching ci.yml -- neither path stops for review,
      # so the generated sections ARE the release notes. Kept identical to the
      # step in ci.yml on purpose: the two paths already share release-notes.sh
      # so they cannot describe the same commits differently, and a difference in
      # how the notes are *shipped* would reintroduce exactly that drift.
      #
      # `--verify-tag` guards the same failure as there: `gh` would otherwise
      # create a missing tag from the default branch's HEAD, attaching the
      # release to a commit other than the bump this workflow just pushed.
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.bump.outputs.version }}
        run: |
          url="$(gh release create "v${VERSION}" \
            --verify-tag \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md")"
          echo "Published [v${VERSION}](${url})" >> "$GITHUB_STEP_SUMMARY"
