name: CI

on:
  push:
    branches: [main]
  pull_request:

# Least privilege by default. The release job below opts itself up to `write`;
# nothing else in this workflow can write to the repo.
permissions:
  contents: read

jobs:
  check:
    # Apple Silicon runner: mlx-lm installs natively, matching the app's runtime.
    runs-on: macos-latest
    # Scoped to this job rather than the whole workflow, so a rapid second push
    # cannot cancel a release job that is already mid tag-push. A superseded run
    # still stops here, and its release job is skipped along with it.
    concurrency:
      group: ci-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      # `--locked` rather than a bare sync: uv.lock records the project's own
      # version, so a hand bump that edits pyproject.toml alone leaves it stale.
      # A bare `uv sync` would quietly rewrite the lock and go green, and the
      # release job below would then tag a commit whose lock disagrees with its
      # pyproject. This fails the run instead.
      - name: Install dependencies (core + dev tools)
        run: uv sync --locked

      - name: Ruff format check
        run: uv run ruff format --check .

      - name: Ruff lint
        run: uv run ruff check .

      - name: Type check
        run: uv run ty check

      - name: Tests
        run: uv run pytest test_streamlit_app.py test_streamlit_ui.py -q

  # Drafts a GitHub Release whenever a version bump lands on main. This is the
  # hand-bump path; release.yml remains the button-driven one, and the two
  # cannot collide -- see the gate step below.
  release:
    needs: check
    # Never on pull_request: a PR must not tag anything, and github.ref would be
    # the merge ref rather than main.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # Plain git + gh, so there is no reason to pay for the 10x-billed macOS
    # runner the checks need for mlx-lm.
    runs-on: ubuntu-latest
    # Overrides the workflow default above; needed to push the tag and to create
    # the release.
    permissions:
      contents: write
    # Shares release.yml's group, so a dispatched release and an auto-draft can
    # never interleave. Never cancelled: a half-finished run leaves a pushed tag
    # with no release attached to it.
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # changelog needs full history and tags

      # "Was this push a version bump?" is deliberately NOT answered by diffing
      # against the parent commit: a push can carry many commits, a re-run would
      # fire twice, and a force-push has no useful parent. The condition is just
      # "pyproject declares a version that has no tag yet" -- idempotent, and the
      # same fact release.yml establishes when it tags the versions it bumps, so
      # a dispatched release leaves nothing here to do.
      #
      # The version is read with the runner's preinstalled python3 rather than
      # `uv version`, the project's usual route: uv would discover and download a
      # whole interpreter to read one TOML field, on every push to main including
      # the ones with nothing to release. tomllib is stdlib from 3.11.
      - name: Check for an unreleased version
        id: gate
        run: |
          version="$(python3 -c 'import tomllib;print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if git ls-remote --exit-code --tags origin "refs/tags/v${version}" >/dev/null 2>&1; then
            echo "v${version} is already tagged - nothing to release." >> "$GITHUB_STEP_SUMMARY"
            echo "release=false" >> "$GITHUB_OUTPUT"
          else
            echo "v${version} has no tag - drafting a release." >> "$GITHUB_STEP_SUMMARY"
            echo "release=true" >> "$GITHUB_OUTPUT"
          fi

      # Must run before the tag is created, or the commit range collapses.
      - name: Build changelog from conventional commits
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
          REPO_URL: ${{ github.server_url }}/${{ github.repository }}
        run: .github/scripts/release-notes.sh "$RUNNER_TEMP/notes.md"

      # Annotated, and on the checked-out commit rather than whatever main
      # points at by now, so the tag names the commit that carried the bump.
      - name: Tag the bump commit
        if: steps.gate.outputs.release == 'true'
        env:
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "v${VERSION}" -m "v${VERSION}"
          git push origin "refs/tags/v${VERSION}"

      # Draft, not published: the generated sections are the part that must stay
      # true, but the Highlights/Requirements/Run blurb can only be written by
      # hand. Edit the draft, then publish.
      - name: Create draft release
        if: steps.gate.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.gate.outputs.version }}
        run: |
          gh release create "v${VERSION}" \
            --draft \
            --title "v${VERSION}" \
            --notes-file "$RUNNER_TEMP/notes.md"
